<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reportes de Progreso</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f6f9; padding: 30px; color: #333; }
    .container { max-width: 1100px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 2px solid #e9ecef; padding-bottom: 15px; }
    h2 { color: #2c3e50; }
    .btn { padding: 9px 16px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
    .btn-primary { background: #0d6efd; color: white; }
    .btn-primary:hover { background: #0b5ed7; }
    .btn-secondary { background: #6c757d; color: white; }
    .btn-secondary:hover { background: #5c636a; }

    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 14px 12px; text-align: left; border-bottom: 1px solid #dee2e6; }
    th { background-color: #f8f9fa; color: #495057; font-weight: 600; }
    tr:hover { background-color: #f8f9fa; }

    .badge-promedio { display: inline-block; padding: 5px 10px; border-radius: 20px; font-weight: bold; }
    .prom-alto { background: #d1e7dd; color: #0f5132; }
    .prom-medio { background: #fff3cd; color: #664d03; }
    .prom-bajo { background: #f8d7da; color: #842029; }

    /* Modal Styling */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: white; padding: 25px; border-radius: 12px; width: 90%; max-width: 700px; max-height: 85vh; overflow-y: auto; position: relative; }
    .close-btn { position: absolute; top: 15px; right: 20px; font-size: 24px; cursor: pointer; color: #aaa; }
    .close-btn:hover { color: #000; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h2>📊 Reporte General de Alumnos</h2>
      <button class="btn btn-secondary" onclick="window.location.href='index.html'">⬅️ Regresar al Inicio</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>Alumno</th>
          <th>Grado / Grupo</th>
          <th>Condición</th>
          <th>Intentos</th>
          <th>Promedio</th>
          <th>Acción</th>
        </tr>
      </thead>
      <tbody id="tbodyAlumnos">
        <tr><td colspan="6" style="text-align: center;">Cargando reporte...</td></tr>
      </tbody>
    </table>
  </div>

  <!-- Modal para ver detalle por alumno -->
  <div id="modalDetalle" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="cerrarModal()">&times;</span>
      <h3 id="modalTitulo" style="margin-bottom: 15px; color: #2c3e50;">Historial de Ejercicios</h3>
      <table>
        <thead>
          <tr>
            <th>Actividad</th>
            <th>Nivel</th>
            <th>Puntaje</th>
            <th>Fecha</th>
          </tr>
        </thead>
        <tbody id="tbodyDetalle"></tbody>
      </table>
    </div>
  </div>

  <script>
    const API_URL = "http://localhost:3001/api/actividades";

    async function cargarReporte() {
      try {
        const res = await fetch(`${API_URL}/reportes/alumnos`);
        const alumnos = await res.json();

        const tbody = document.getElementById("tbodyAlumnos");
        tbody.innerHTML = "";

        if (alumnos.length === 0) {
          tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;">No hay alumnos registrados.</td></tr>`;
          return;
        }

        alumnos.forEach(a => {
          let badgeClass = "prom-bajo";
          if (a.promedio_general >= 80) badgeClass = "prom-alto";
          else if (a.promedio_general >= 60) badgeClass = "prom-medio";

          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td><strong>${a.nombre_anonimanizado}</strong></td>
            <td>${a.grado}° "${a.grupo}"</td>
            <td>${a.condicion}</td>
            <td>${a.total_intentos} realizados</td>
            <td><span class="badge-promedio ${badgeClass}">${a.promedio_general}%</span></td>
            <td>
              <button class="btn btn-primary" onclick="verHistorial(${a.id_alumno}, '${a.nombre_anonimanizado}')">
                🔍 Ver Historial
              </button>
            </td>
          `;
          tbody.appendChild(tr);
        });
      } catch (error) {
        console.error("Error al cargar reporte:", error);
        document.getElementById("tbodyAlumnos").innerHTML = `<tr><td colspan="6" style="text-align:center; color:red;">Error al conectar con el servidor.</td></tr>`;
      }
    }

    async function verHistorial(idAlumno, nombre) {
      document.getElementById("modalTitulo").innerText = `Historial: ${nombre}`;
      document.getElementById("modalDetalle").style.display = "flex";
      const tbody = document.getElementById("tbodyDetalle");
      tbody.innerHTML = `<tr><td colspan="4">Cargando historial...</td></tr>`;

      try {
        const res = await fetch(`${API_URL}/reportes/alumno/${idAlumno}`);
        const historial = await res.json();
        tbody.innerHTML = "";

        if (historial.length === 0) {
          tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;">El alumno aún no ha realizado actividades.</td></tr>`;
          return;
        }

        historial.forEach(h => {
          const fechaFormateada = new Date(h.fecha).toLocaleString('es-MX', {
            dateStyle: 'short',
            timeStyle: 'short'
          });

          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${h.actividad}</td>
            <td>${h.nivel}</td>
            <td><strong>${h.puntaje}%</strong></td>
            <td>${fechaFormateada}</td>
          `;
          tbody.appendChild(tr);
        });
      } catch (error) {
        console.error("Error al cargar historial:", error);
        tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:red;">Error al obtener el historial.</td></tr>`;
      }
    }

    function cerrarModal() {
      document.getElementById("modalDetalle").style.display = "none";
    }

    window.onclick = function(event) {
      const modal = document.getElementById("modalDetalle");
      if (event.target === modal) {
        cerrarModal();
      }
    }

    // Inicializar la tabla al cargar la página
    cargarReporte();
  </script>
</body>
</html>
