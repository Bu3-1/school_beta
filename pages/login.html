<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Iniciar Sesión - Maestros</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f6f9; }
    .card { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); max-width: 400px; margin: 0 auto; }
    input, button { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; }
    button { background-color: #007bff; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
    button:hover { background-color: #0056b3; }
    a { color: #007bff; text-decoration: none; font-weight: bold; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Iniciar Sesión (Maestro)</h2>

    <form id="formLogin">
      <input type="email" id="loginCorreo" placeholder="Correo electrónico" required>
      <input type="password" id="loginPassword" placeholder="Contraseña" required>
      <button type="submit">Ingresar</button>
    </form>

    <p style="text-align: center; font-size: 14px; margin-top: 15px;">
      ¿No tienes cuenta? <a href="register.html">Regístrate aquí</a>
    </p>
  </div>

  <script>
    const API_URL = "http://localhost:4000";

    document.getElementById("formLogin").addEventListener("submit", async (e) => {
      e.preventDefault();
      const correo = document.getElementById("loginCorreo").value;
      const password = document.getElementById("loginPassword").value;

      try {
        const res = await fetch(`${API_URL}/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ correo, password })
        });
        const data = await res.json();

        if (res.ok) {
          localStorage.setItem("token", data.token);
          localStorage.setItem("maestro", JSON.stringify(data.maestro));
          // Redirige a la selección de alumnos
          window.location.href = "index.html";
        } else {
          alert("Error: " + (data.error || "Credenciales incorrectas"));
        }
      } catch (err) {
        alert("Error de conexión con el servidor de Login");
      }
    });
  </script>
</body>
</html>
