<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Presilábico - Lectura</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 20px; text-align: center; }
    .container { background: white; max-width: 600px; margin: 0 auto; padding: 25px; border-radius: 12px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    .header { display: flex; justify-content: space-between; align-items: center; background: #e9ecef; padding: 10px 15px; border-radius: 8px; font-weight: bold; }
    .imagen-ejercicio { font-size: 80px; margin: 15px 0; }
    
    .pregunta { font-size: 20px; color: #333; margin-bottom: 20px; }

    /* Tarjetas de palabras para leer */
    .opciones { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; }
    .btn-lectura { 
      padding: 16px; 
      font-size: 24px; 
      font-weight: bold; 
      letter-spacing: 3px;
      border: 3px solid #28a745; 
      background: #fff; 
      color: #28a745; 
      border-radius: 10px; 
      cursor: pointer; 
      transition: all 0.2s;
    }
    .btn-lectura:hover { background: #28a745; color: white; transform: scale(1.02); }
    .btn-regresar { margin-top: 25px; background: #6c757d; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <span id="txtAlumno">👤 Alumno: ---</span>
      <span id="txtPuntaje">⭐ Puntos: 0</span>
    </div>

    <h2>📖 ¡Lee y Señala la Palabra!</h2>
    <p class="pregunta" id="txtPregunta">¿Qué dice la palabra que le corresponde a la imagen?</p>
    
    <div class="imagen-ejercicio" id="emojiIcono">🐶</div>

    <div class="opciones" id="contenedorOpciones">
      <!-- Opciones dinámicas -->
    </div>

    <button class="btn-regresar" onclick="window.location.href='categorias.html'">⬅️ Regresar</button>
  </div>

  <script>
    const token = localStorage.getItem("token");
    const alumno = JSON.parse(localStorage.getItem("alumnoActivo"));
    const ID_ACTIVIDAD = 2; // 🚨 Asegúrate de que exista una actividad con ID 2 o ajústalo a tu BD (ej. Categoria: lectura)

    if (!token || !alumno) {
      window.location.href = "index.html";
    }

    document.getElementById("txtAlumno").innerText = `👤 Alumno: ${alumno.nombre_anonimanizado}`;

    // Ejercicios de lectura global para presilábicos
    const ejercicios = [
      { emoji: "🐶", correcta: "PERRO", distracciones: ["PELO", "GATO"] },
      { emoji: "🍎", correcta: "MANZANA", distracciones: ["MESA", "PERA"] },
      { emoji: "🐟", correcta: "PEZ", distracciones: ["PAN", "SOL"] },
      { emoji: "🌟", correcta: "ESTRELLA", distracciones: ["ESCUELA", "LUNA"] }
    ];

    let indiceActual = 0;
    let aciertos = 0;

    function cargarEjercicio() {
      if (indiceActual >= ejercicios.length) {
        finalizarJuego();
        return;
      }

      const ej = ejercicios[indiceActual];
      document.getElementById("emojiIcono").innerText = ej.emoji;
      
      const contenedor = document.getElementById("contenedorOpciones");
      contenedor.innerHTML = "";

      // Combinamos la correcta con las distracciones y las revolvemos
      const opciones = [ej.correcta, ...ej.distracciones].sort(() => Math.random() - 0.5);

      opciones.forEach(palabra => {
        const btn = document.createElement("button");
        btn.className = "btn-lectura";
        btn.innerText = palabra;
        btn.onclick = () => verificarLectura(palabra, ej.correcta);
        contenedor.appendChild(btn);
      });
    }

    function verificarLectura(seleccionada, correcta) {
      if (seleccionada === correcta) {
        aciertos++;
        alert("¡Muy bien leído! 📖🎉");
      } else {
        alert(`¡Casi! Dijiste "${seleccionada}", pero la palabra era "${correcta}".`);
      }

      indiceActual++;
      document.getElementById("txtPuntaje").innerText = `⭐ Puntos: ${aciertos}/${ejercicios.length}`;
      cargarEjercicio();
    }

    async function finalizarJuego() {
      const porcentajeFinal = Math.round((aciertos / ejercicios.length) * 100);

      document.getElementById("emojiIcono").innerText = "🏆";
      document.getElementById("txtPregunta").innerText = "¡Actividad de Lectura Completada!";
      document.getElementById("contenedorOpciones").innerHTML = `
        <h3>Puntaje obtenido: ${porcentajeFinal}%</h3>
        <p>Guardando resultado en el expediente...</p>
      `;

      try {
        await fetch("http://localhost:3001/api/intentosActividades", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
          },
          body: JSON.stringify({
            id_alumno: alumno.id,
            id_actividad: ID_ACTIVIDAD,
            puntaje: porcentajeFinal
          })
        });
      } catch (err) {
        console.error("Error al guardar intento:", err);
      }
    }

    cargarEjercicio();
  </script>
</body>
</html>
