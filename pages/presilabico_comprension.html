<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Presilábico - Comprensión 1</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 20px; text-align: center; }
    .container { background: white; max-width: 600px; margin: 0 auto; padding: 25px; border-radius: 12px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    .header { display: flex; justify-content: space-between; align-items: center; background: #e9ecef; padding: 10px 15px; border-radius: 8px; font-weight: bold; }
    
    .lectura-box {
      background: #e0f7fa; border: 3px solid #17a2b8; border-radius: 12px;
      padding: 20px; margin: 20px 0; font-size: 24px; font-weight: bold; color: #006666; line-height: 1.5;
    }

    .pregunta-titulo { font-size: 20px; color: #333; margin: 15px 0; font-weight: bold; }
    .opciones { display: flex; flex-direction: column; gap: 12px; margin-top: 15px; }
    .btn-opcion {
      padding: 15px; font-size: 20px; font-weight: bold; border: 2px solid #17a2b8;
      background: white; color: #006666; border-radius: 8px; cursor: pointer; transition: 0.2s;
    }
    .btn-opcion:hover { background: #17a2b8; color: white; }
    .btn-regresar { margin-top: 25px; background: #6c757d; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <span id="txtAlumno">👤 Alumno: ---</span>
      <span id="txtPuntaje">⭐ Puntos: 0</span>
    </div>

    <h2>📖 Lectura y Preguntas</h2>

    <!-- Lectura de la historia -->
    <div class="lectura-box" id="boxLectura">
      🐶 Tito es un perro. <br>
      ⚽ Tito juega con una pelota roja.
    </div>

    <!-- Pregunta actual -->
    <div class="pregunta-titulo" id="txtPregunta">1. ¿Quién es Tito?</div>

    <div class="opciones" id="contenedorOpciones"></div>

    <button class="btn-regresar" onclick="window.location.href='categorias.html'">⬅️ Regresar</button>
  </div>

  <script>
    const token = localStorage.getItem("token");
    const alumno = JSON.parse(localStorage.getItem("alumnoActivo"));
    const ID_ACTIVIDAD = 3;

    if (!token || !alumno) window.location.href = "index.html";
    document.getElementById("txtAlumno").innerText = `👤 Alumno: ${alumno.nombre_anonimanizado}`;

    // Banco de lecturas con sus respectivas preguntas
    const lecturas = [
      {
        texto: "🐶 Tito es un perro.<br>⚽ Tito juega con una pelota.",
        preguntas: [
          { q: "¿Quién es Tito?", correcta: "Un perro 🐶", opciones: ["Un perro 🐶", "Un gato 🐱", "Un pajaro 🐦"] },
          { q: "¿Con qué juega Tito?", correcta: "Una pelota ⚽", opciones: ["Un hueso 🦴", "Una pelota ⚽", "Un coche 🚗"] }
        ]
      },
      {
        texto: "👧 Lía come una manzana.<br>🍎 La manzana es roja y dulce.",
        preguntas: [
          { q: "¿Qué come Lía?", correcta: "Una manzana 🍎", opciones: ["Una manzana 🍎", "Un helado 🍦", "Una pizza 🍕"] },
          { q: "¿De qué color es la manzana?", correcta: "Roja 🔴", opciones: ["Verde 🟢", "Roja 🔴", "Azul 🔵"] }
        ]
      }
    ];

    let lecturaIndex = 0;
    let preguntaIndex = 0;
    let aciertos = 0;
    let totalPreguntas = 0;

    // Calcular total de preguntas
    lecturas.forEach(l => totalPreguntas += l.preguntas.length);

    function cargarPregunta() {
      if (lecturaIndex >= lecturas.length) {
        finalizarJuego();
        return;
      }

      const lActual = lecturas[lecturaIndex];
      document.getElementById("boxLectura").innerHTML = lActual.texto;

      const pActual = lActual.preguntas[preguntaIndex];
      document.getElementById("txtPregunta").innerText = pActual.q;

      const cont = document.getElementById("contenedorOpciones");
      cont.innerHTML = "";

      pActual.opciones.sort(() => Math.random() - 0.5).forEach(opc => {
        const btn = document.createElement("button");
        btn.className = "btn-opcion";
        btn.innerText = opc;
        btn.onclick = () => responder(opc, pActual.correcta);
        cont.appendChild(btn);
      });
    }

    function responder(seleccion, correcta) {
      if (seleccion === correcta) {
        aciertos++;
        alert("¡Correcto! 👏");
      } else {
        alert("¡Casi! Revisa bien la lectura.");
      }

      preguntaIndex++;
      if (preguntaIndex >= lecturas[lecturaIndex].preguntas.length) {
        preguntaIndex = 0;
        lecturaIndex++;
      }

      document.getElementById("txtPuntaje").innerText = `⭐ Puntos: ${aciertos}/${totalPreguntas}`;
      cargarPregunta();
    }

    async function finalizarJuego() {
      const porcentajeFinal = Math.round((aciertos / totalPreguntas) * 100);

      document.getElementById("boxLectura").innerText = "🏆 ¡Has terminado la lectura!";
      document.getElementById("txtPregunta").innerText = "";
      document.getElementById("contenedorOpciones").innerHTML = `
        <h3>Puntaje obtenido: ${porcentajeFinal}%</h3>
        <p>Guardando resultado...</p>
      `;

      try {
        await fetch("http://localhost:3000/api/intentosActividades", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
          body: JSON.stringify({ id_alumno: alumno.id, id_actividad: ID_ACTIVIDAD, puntaje: porcentajeFinal })
        });
      } catch (err) { console.error(err); }
    }

    cargarPregunta();
  </script>
</body>
</html>
